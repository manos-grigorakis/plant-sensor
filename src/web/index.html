<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Sensor Setup</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <main class="setup-card">
        <header class="setup-header">
            <h1>Plant Sensor</h1>
            <p>Connect your device to your Wi-Fi network to get started.</p>
        </header>

        <section class="setup-content">
            <form>
                <h2>Wi-Fi Configuration</h2>
                <div class="form-group">
                    <label for="ssid">Network name (SSID)</label>
                    <input
                        id="ssid"
                        type="text"
                        name="ssid"
                        placeholder="Enter Wi-Fi network name"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Wi-Fi Password</label>
                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="Enter Wi-Fi password"
                        required
                    >
                </div>

                <h2>Sensor & MQTT Configuration</h2>
                <div class="form-group">
                    <label for="plant-name">Plant Name</label>
                    <input
                        id="plant-name"
                        type="text"
                        name="plant-name"
                        placeholder="Enter your plant name"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="mqtt-server">MQTT Server</label>
                    <input
                        id="mqtt-server"
                        type="text"
                        name="mqtt-server"
                        placeholder="Enter your MQTT server"
                        autocomplete="off"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="mqtt-port">MQTT Port</label>
                    <input
                        id="mqtt-port"
                        type="number"
                        name="mqtt-port"
                        value="1883"
                        min="1"
                        max="65535"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="mqtt-username">MQTT Username</label>
                    <input
                        id="mqtt-username"
                        type="text"
                        name="mqtt-username"
                        placeholder="Enter MQTT Username"
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="mqtt-password">MQTT Password</label>
                    <input
                        id="mqtt-password"
                        type="password"
                        name="mqtt-password"
                        placeholder="Enter MQTT Password"
                        autocomplete="new-password"
                    >
                </div>


                <button type="submit" class="submit-button">
                    Save and Connect
                </button>
            </form>

            <p class="form-footer">
                Your network credentials and configuration will be saved on this device.
            </p>
        </section>
    </main>
</body>
</html>
